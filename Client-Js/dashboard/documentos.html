<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conocimiento — Knova Hub</title>
    <link rel="stylesheet" href="./css/dashboard.css">
    <link rel="stylesheet" href="./css/manage.css">
    <script src="./js/app.js" defer></script>
    <script src="./js/documentos.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>

    <div class="shell">
        <aside class="sidebar">
            <a class="sidebar-logo" href="../home/index.html" aria-label="Knova Hub — Inicio">
                <img src="../assets/logo.png" alt="Knova Hub" width="1983" height="793">
            </a>

            <nav class="side-nav" aria-label="Navegación del panel">
                <a class="nav-item" data-page="dashboard" href="dashboard.html">Inicio</a>
                <a class="nav-item" data-page="usuarios" data-role-gestion href="usuarios.html">Usuarios</a>
                <a class="nav-item" data-page="solicitudes" data-role-gestion href="solicitudes.html">Solicitudes</a>
                <a class="nav-item" data-page="departamentos" data-role-gestion href="departamentos.html">Departamentos</a>
                <a class="nav-item" data-page="documentos" href="documentos.html">Documentos</a>
                <a class="nav-item" href="documentos.html?tipo=wiki">Wikis y minutas</a>
                <a class="nav-item" href="#">Recomendaciones (IA)</a>
            </nav>
        </aside>

        <div class="main">
            <header class="topbar">
                <h2 class="topbar-title" id="module-title">Conocimiento</h2>

                <div class="user-menu">
                    <div class="user-info">
                        <span class="user-name" id="user-name"></span>
                        <span class="role-badge" id="user-role"></span>
                    </div>
                    <button type="button" class="logout-btn" id="logout">Cerrar sesión</button>
                </div>
            </header>

            <main class="dashboard-content" id="contenido">
                <div class="page-header">
                    <div>
                        <h1 id="page-title">Documentos</h1>
                        <p class="page-subtitle" id="list-status" role="status"></p>
                    </div>
                    <button type="button" class="btn btn-primary" id="new-item" hidden>Crear</button>
                </div>
                <p class="form-message is-error" id="list-error" role="alert" hidden></p>
                <section class="card" aria-label="Listado de conocimiento">
                    <div class="form-grid">
                        <label class="field">Buscar <input type="search" id="search" placeholder="Título, descripción o contenido"></label>
                        <label class="field" id="type-filter" hidden>Tipo
                            <select id="filter-type">
                                <option value="">Wikis y minutas</option>
                                <option value="2">Wiki</option>
                                <option value="3">Minuta</option>
                            </select>
                        </label>
                        <label class="field">Departamento <select id="filter-department"></select></label>
                        <label class="field">Categoría <select id="filter-category"></select></label>
                        <label class="field">Etiqueta <select id="filter-tag"></select></label>
                    </div>
                    <div class="table-wrap">
                        <table class="table">
                            <thead><tr>
                                <th>Título</th><th>Tipo</th><th>Visibilidad</th><th>Categoría</th><th>Autor</th><th>Acciones</th>
                            </tr></thead>
                            <tbody id="items"></tbody>
                        </table>
                    </div>
                </section>
                <section class="card" id="editor" hidden>
                    <h2 id="editor-title"></h2>
                    <form id="editor-form">
                        <div class="form-grid">
                            <label class="field">Título <input id="title" maxlength="200" required></label>
                            <label class="field" id="type-field">Tipo
                                <select id="type">
                                    <option value="2">Wiki</option>
                                    <option value="3">Minuta</option>
                                </select>
                            </label>
                            <label class="field">Visibilidad
                                <select id="visibility">
                                    <option value="1">General</option>
                                    <option value="2">Departamento</option>
                                </select>
                            </label>
                            <label class="field">Departamento <select id="department"></select></label>
                            <label class="field">Categoría <select id="category"></select></label>
                            <label class="field">Etiquetas
                                <select id="tags" multiple size="4"></select>
                                <span class="inline-note">Puedes seleccionar varias etiquetas.</span>
                            </label>
                        </div>
                        <div class="form-grid">
                            <label class="field">Descripción <textarea id="description" rows="3" maxlength="1000"></textarea></label>
                            <label class="field">Contenido <textarea id="content" rows="7"></textarea></label>
                        </div>
                        <div class="form-grid" id="file-field">
                            <label class="field">Archivo adjunto
                                <input type="file" id="file" accept=".pdf,.docx,.txt,.md" aria-describedby="file-note">
                                <span id="file-note" class="inline-note"></span>
                            </label>
                        </div>
                        <p class="form-message is-error" id="editor-error" role="alert" hidden></p>
                        <div class="form-actions">
                            <button class="btn btn-primary" id="save" type="submit">Guardar</button>
                            <button class="btn" id="cancel" type="button">Cancelar</button>
                        </div>
                    </form>
                </section>
                <section class="card" id="detail" hidden>
                    <div class="page-header">
                        <h2 id="detail-title" tabindex="-1"></h2>
                        <button class="btn" id="close-detail" type="button">Cerrar</button>
                    </div>
                    <p class="page-subtitle" id="detail-meta"></p>
                    <p class="knowledge-text" id="detail-description"></p>
                    <div class="knowledge-text" id="detail-content"></div>
                    <p class="inline-note" id="detail-file"></p>
                    <p class="form-message is-error" id="detail-error" role="alert" hidden></p>
                    <div class="form-actions toolbar">
                        <button class="btn" id="download" type="button" hidden>Descargar archivo</button>
                        <button class="btn" id="remove-file" type="button" hidden>Quitar archivo</button>
                        <button class="btn" id="edit" type="button" hidden>Editar</button>
                        <button class="btn btn-danger" id="delete" type="button" hidden>Eliminar</button>
                    </div>
                </section>
            </main>
        </div>
    </div>
</body>
</html>
