<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Inicia sesión en Knova Hub para acceder al conocimiento de tu organización.">

    <title>Iniciar sesión — Knova Hub</title>

    <link rel="stylesheet" href="auth.css">
    <script src="auth.js" defer></script>
</head>

<body>
    <a class="skip-link" href="#contenido">Saltar al formulario</a>

    <main class="auth-layout" id="contenido">
        <aside class="auth-brand" aria-hidden="true">
            <div class="auth-brand-inner">
                <span class="brand-mark" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>

                <p class="auth-brand-kicker">Knova Hub</p>
                <h1>El conocimiento de tu empresa, conectado.</h1>
                <p>
                    Captura, organiza y recomienda el conocimiento interno
                    de tu organización desde un solo lugar.
                </p>
            </div>
        </aside>

        <section class="auth-panel" aria-labelledby="login-title">
            <div class="auth-form-wrap">
                <a class="auth-logo" href="index.html" aria-label="Knova Hub — Inicio">
                    <img src="assets/logo.png" alt="Knova Hub" width="1983" height="793">
                </a>

                <div class="auth-heading">
                    <h2 id="login-title">Iniciar sesión</h2>
                    <p>Accede con tu RNC o correo corporativo.</p>
                </div>

                <form id="login-form" class="auth-form" novalidate>
                    <div class="form-message" id="form-message" role="alert" hidden></div>

                    <div class="field">
                        <label for="identificador">RNC o correo corporativo <span class="req">*</span></label>
                        <input
                            type="text"
                            id="identificador"
                            name="identificador"
                            placeholder="101123456 o contacto@empresa.com"
                            autocomplete="username"
                            required>
                    </div>

                    <div class="field">
                        <div class="field-label-row">
                            <label for="password">Contraseña <span class="req">*</span></label>
                            <a href="#recuperar">¿Olvidaste tu contraseña?</a>
                        </div>
                        <div class="password-wrap">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="••••••••"
                                autocomplete="current-password"
                                required>
                            <button type="button" class="password-toggle" data-toggle="password" aria-label="Mostrar contraseña">
                                Mostrar
                            </button>
                        </div>
                    </div>

                    <label class="checkbox-row">
                        <input type="checkbox" name="recordar" value="1">
                        <span>Mantener la sesión iniciada</span>
                    </label>

                    <button class="button button-primary" type="submit">
                        Iniciar sesión
                    </button>
                </form>

                <p class="auth-switch">
                    ¿Aún no tienes cuenta?
                    <a href="register.html">Registrar empresa</a>
                </p>
            </div>
        </section>
    </main>
</body>

</html>
