<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Dashboard de Knova Hub para la gestión del conocimiento empresarial.">

    <title>Dashboard — Knova Hub</title>

    <link rel="stylesheet" href="dashboard.css">
    <script src="dashboard.js" defer></script>
</head>

<body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>

    <header class="dashboard-header">
        <div class="container header-inner">
            <a class="logo" href="index.html" aria-label="Knova Hub — Inicio">
                <img src="assets/logo.png" alt="Knova Hub" width="1983" height="793">
            </a>

            <div class="user-menu">
                <div class="user-info">
                    <span class="user-name" id="user-name"></span>
                    <span class="role-badge" id="user-role"></span>
                </div>
                <button type="button" class="logout-btn" id="logout">Cerrar sesión</button>
            </div>
        </div>
    </header>

    <main class="dashboard-main" id="contenido">
        <div class="container">
            <div class="dashboard-heading">
                <h1 id="greeting"></h1>
                <p id="company-name"></p>
            </div>

            <div class="empty-state">
                <p class="empty-title">Tu dashboard está vacío</p>
                <p>Aquí aparecerá el conocimiento de tu empresa.</p>
            </div>
        </div>
    </main>
</body>

</html>
