<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Registra tu empresa en Knova Hub y organiza su conocimiento.">

    <title>Registrar empresa — Knova Hub</title>

    <link rel="stylesheet" href="auth.css">
    <script src="auth.js" defer></script>
</head>

<body>
    <a class="skip-link" href="#contenido">Saltar al formulario</a>

    <main class="auth-layout" id="contenido">
        <aside class="auth-brand" aria-hidden="true">
            <div class="auth-brand-inner">
                <span class="brand-mark" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>

                <p class="auth-brand-kicker">Knova Hub</p>
                <h1>El conocimiento de tu empresa, conectado.</h1>
                <p>
                    Registra tu organización y centraliza su conocimiento
                    en un solo lugar.
                </p>
            </div>
        </aside>

        <section class="auth-panel" aria-labelledby="register-title">
            <div class="auth-form-wrap">
                <a class="auth-logo" href="index.html" aria-label="Knova Hub — Inicio">
                    <img src="assets/logo.png" alt="Knova Hub" width="1983" height="793">
                </a>

                <div class="auth-heading">
                    <h2 id="register-title">Registrar empresa</h2>
                    <p>Completa los datos de tu organización.</p>
                </div>

                <form id="register-form" class="auth-form" novalidate>
                    <div class="form-message" id="form-message" role="alert" hidden></div>

                    <div class="field-row">
                        <div class="field">
                            <label for="rnc">RNC <span class="req">*</span></label>
                            <input
                                type="text"
                                id="rnc"
                                name="rnc"
                                placeholder="101123456"
                                inputmode="numeric"
                                maxlength="11"
                                autocomplete="off"
                                required>
                        </div>

                        <div class="field">
                            <label for="telefono">Teléfono <span class="req">*</span></label>
                            <input
                                type="tel"
                                id="telefono"
                                name="telefono"
                                placeholder="809-555-1234"
                                autocomplete="tel"
                                required>
                        </div>
                    </div>

                    <div class="field">
                        <label for="nombre">Nombre de la empresa <span class="req">*</span></label>
                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            placeholder="Nombre comercial o razón social"
                            autocomplete="organization"
                            required>
                    </div>

                    <div class="field">
                        <label for="email">Email corporativo <span class="req">*</span></label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="contacto@empresa.com"
                            autocomplete="email"
                            required>
                    </div>

                    <div class="field">
                        <label for="direccion">Dirección física <span class="req">*</span></label>
                        <textarea
                            id="direccion"
                            name="direccion"
                            rows="3"
                            placeholder="Sede principal de la empresa"
                            autocomplete="street-address"
                            required></textarea>
                    </div>

                    <div class="field">
                        <label for="contacto">Nombre del contacto principal <span class="req">*</span></label>
                        <input
                            type="text"
                            id="contacto"
                            name="contacto"
                            placeholder="Persona a quien dirigirse"
                            autocomplete="name"
                            required>
                    </div>

                    <div class="field">
                        <label for="password">Contraseña <span class="req">*</span></label>
                        <div class="password-wrap">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Mínimo 8 caracteres"
                                autocomplete="new-password"
                                required>
                            <button type="button" class="password-toggle" data-toggle="password" aria-label="Mostrar contraseña">
                                Mostrar
                            </button>
                        </div>
                    </div>

                    <div class="field">
                        <label for="confirmar">Confirmar contraseña <span class="req">*</span></label>
                        <div class="password-wrap">
                            <input
                                type="password"
                                id="confirmar"
                                name="confirmar"
                                placeholder="Repite tu contraseña"
                                autocomplete="new-password"
                                required>
                            <button type="button" class="password-toggle" data-toggle="confirmar" aria-label="Mostrar contraseña">
                                Mostrar
                            </button>
                        </div>
                    </div>

                    <button class="button button-primary" type="submit">
                        Crear cuenta
                    </button>
                </form>

                <p class="auth-switch">
                    ¿Ya tienes cuenta?
                    <a href="login.html">Iniciar sesión</a>
                </p>
            </div>
        </section>
    </main>
</body>

</html>
