<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Crea tu cuenta en Knova Hub y únete al conocimiento de tu organización.">

    <title>Crear cuenta — Knova Hub</title>

    <link rel="stylesheet" href="auth.css">
    <script src="auth.js" defer></script>
</head>

<body>
    <a class="skip-link" href="#contenido">Saltar al formulario</a>

    <main class="auth-layout" id="contenido">
        <aside class="auth-brand" aria-hidden="true">
            <div class="auth-brand-inner">
                <span class="brand-mark" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>

                <p class="auth-brand-kicker">Knova Hub</p>
                <h1>Únete al conocimiento de tu equipo.</h1>
                <p>
                    Crea tu cuenta y accede a los documentos, wikis y
                    recomendaciones que tu organización comparte contigo.
                </p>
            </div>
        </aside>

        <section class="auth-panel" aria-labelledby="register-title">
            <div class="auth-form-wrap">
                <a class="auth-logo" href="index.html" aria-label="Knova Hub — Inicio">
                    <img src="assets/logo.png" alt="Knova Hub" width="1983" height="793">
                </a>

                <div class="auth-heading">
                    <h2 id="register-title">Crear cuenta</h2>
                    <p>Completa tus datos para empezar.</p>
                </div>

                <form class="auth-form" action="#" method="post" novalidate>
                    <div class="field-row">
                        <div class="field">
                            <label for="nombre">Nombre</label>
                            <input
                                type="text"
                                id="nombre"
                                name="nombre"
                                placeholder="María"
                                autocomplete="given-name"
                                required>
                        </div>

                        <div class="field">
                            <label for="apellido">Apellido</label>
                            <input
                                type="text"
                                id="apellido"
                                name="apellido"
                                placeholder="Pérez"
                                autocomplete="family-name"
                                required>
                        </div>
                    </div>

                    <div class="field">
                        <label for="correo">Correo electrónico</label>
                        <input
                            type="email"
                            id="correo"
                            name="correo"
                            placeholder="tu.usuario@empresa.com"
                            autocomplete="email"
                            required>
                    </div>

                    <div class="field">
                        <label for="usuario">Usuario</label>
                        <input
                            type="text"
                            id="usuario"
                            name="usuario"
                            placeholder="mperez"
                            autocomplete="username"
                            required>
                    </div>

                    <div class="field">
                        <label for="contrasena">Contraseña</label>
                        <div class="password-wrap">
                            <input
                                type="password"
                                id="contrasena"
                                name="contrasena"
                                placeholder="Mínimo 8 caracteres"
                                autocomplete="new-password"
                                required>
                            <button type="button" class="password-toggle" data-toggle="contrasena" aria-label="Mostrar contraseña">
                                Mostrar
                            </button>
                        </div>
                    </div>

                    <div class="field">
                        <label for="confirmar">Confirmar contraseña</label>
                        <div class="password-wrap">
                            <input
                                type="password"
                                id="confirmar"
                                name="confirmar"
                                placeholder="Repite tu contraseña"
                                autocomplete="new-password"
                                required>
                            <button type="button" class="password-toggle" data-toggle="confirmar" aria-label="Mostrar contraseña">
                                Mostrar
                            </button>
                        </div>
                    </div>

                    <button class="button button-primary" type="submit">
                        Crear cuenta
                    </button>
                </form>

                <p class="auth-switch">
                    ¿Ya tienes cuenta?
                    <a href="login.html">Iniciar sesión</a>
                </p>
            </div>
        </section>
    </main>
</body>

</html>
